services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weathervane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weathervane}
      POSTGRES_DB: ${POSTGRES_DB:-weathervane}
    volumes:
      # postgres 18+ keeps data under /var/lib/postgresql/18/docker, so mount the parent
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-weathervane}:${POSTGRES_PASSWORD:-weathervane}@db:5432/${POSTGRES_DB:-weathervane}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
